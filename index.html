<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIRH — Mairie de Port-Gentil</title>

<!-- Polices -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Plus Jakarta Sans"', 'sans-serif'],
          sans: ['Inter', 'sans-serif'],
        },
        colors: {
          navy: {
            50:  '#eef2f7',
            100: '#d6e0ec',
            200: '#adc1d9',
            300: '#7f9dc0',
            400: '#4f74a0',
            500: '#345885',
            600: '#26436a',
            700: '#1c3453',
            800: '#132540',
            900: '#0b1930',
            950: '#060f1d',
          },
          lagoon: {
            400: '#3fb6a8',
            500: '#2c9c8f',
            600: '#217d73',
          },
          sable: '#f6f3ec',
        },
      },
    },
  };
</script>

<!-- Librairies -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  [x-cloak] { display: none !important; }
  body { background: #eef1f5; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #b9c4d1; border-radius: 999px; }
  .card { background: #fff; border: 1px solid #e4e9f0; border-radius: 14px; }
</style>
</head>
<body class="font-sans text-navy-900 antialiased" x-data="rhApp()" x-init="initApp()">

<!-- ============================================================ -->
<!-- ÉCRAN DE CONNEXION                                            -->
<!-- ============================================================ -->
<div x-show="!session" x-cloak
     class="min-h-screen flex items-center justify-center px-4"
     style="background: radial-gradient(circle at 20% 20%, #1c3453, #0b1930 65%);">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-lagoon-500/20 border border-lagoon-400/40 flex items-center justify-center mb-4">
        <i data-lucide="landmark" class="w-7 h-7 text-lagoon-400"></i>
      </div>
      <h1 class="font-display text-white text-xl font-bold tracking-tight">SIRH</h1>
      <p class="text-navy-200 text-sm mt-1">Mairie de Port-Gentil</p>
    </div>

    <form @submit.prevent="login()" class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-6 space-y-4">
      <div>
        <label class="block text-xs font-medium text-navy-200 mb-1.5">Adresse e-mail</label>
        <input type="email" x-model="loginForm.email" required autocomplete="username"
               class="w-full px-3.5 py-2.5 rounded-lg bg-white/10 border border-white/15 text-white placeholder-navy-300 text-sm focus:outline-none focus:ring-2 focus:ring-lagoon-400 focus:border-transparent"
               placeholder="prenom.nom@portgentil.ga">
      </div>
      <div>
        <label class="block text-xs font-medium text-navy-200 mb-1.5">Mot de passe</label>
        <input type="password" x-model="loginForm.password" required autocomplete="current-password"
               class="w-full px-3.5 py-2.5 rounded-lg bg-white/10 border border-white/15 text-white placeholder-navy-300 text-sm focus:outline-none focus:ring-2 focus:ring-lagoon-400 focus:border-transparent"
               placeholder="••••••••">
      </div>

      <p x-show="loginError" x-cloak x-text="loginError" class="text-sm text-red-300 bg-red-500/10 border border-red-400/30 rounded-lg px-3 py-2"></p>

      <button type="submit" :disabled="loginLoading"
              class="w-full bg-lagoon-500 hover:bg-lagoon-600 disabled:opacity-60 text-white text-sm font-semibold rounded-lg py-2.5 transition flex items-center justify-center gap-2">
        <i data-lucide="loader-2" x-show="loginLoading" class="w-4 h-4 animate-spin"></i>
        <span x-text="loginLoading ? 'Connexion…' : 'Se connecter'"></span>
      </button>
    </form>

    <p class="text-center text-navy-400 text-xs mt-6">Accès réservé au personnel autorisé de la Mairie de Port-Gentil</p>
  </div>
</div>

<!-- ============================================================ -->
<!-- APPLICATION (après connexion)                                 -->
<!-- ============================================================ -->
<div x-show="session" x-cloak class="min-h-screen flex">

  <!-- Barre latérale -->
  <aside :class="sidebarOpen ? 'w-64' : 'w-[72px]'"
         class="bg-navy-900 text-navy-100 flex flex-col shrink-0 transition-all duration-200 sticky top-0 h-screen">
    <div class="h-16 flex items-center gap-3 px-4 border-b border-white/10 shrink-0">
      <div class="w-9 h-9 rounded-lg bg-lagoon-500/20 border border-lagoon-400/40 flex items-center justify-center shrink-0">
        <i data-lucide="landmark" class="w-5 h-5 text-lagoon-400"></i>
      </div>
      <div x-show="sidebarOpen" class="min-w-0">
        <p class="font-display font-bold text-sm text-white leading-none">SIRH</p>
        <p class="text-[11px] text-navy-300 mt-0.5 truncate">Port-Gentil</p>
      </div>
    </div>

    <nav class="flex-1 overflow-y-auto py-3 px-2 space-y-0.5">
      <template x-for="item in modules" :key="item.id">
        <button @click="currentView = item.id"
                :class="currentView === item.id ? 'bg-lagoon-500/15 text-white border-lagoon-400/40' : 'text-navy-300 border-transparent hover:bg-white/5 hover:text-white'"
                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg border text-sm transition group"
                :title="!sidebarOpen ? item.label : ''">
          <i :data-lucide="item.icon" class="w-[18px] h-[18px] shrink-0"></i>
          <span x-show="sidebarOpen" x-text="item.label" class="truncate"></span>
          <span x-show="sidebarOpen && item.badge" x-text="item.badge"
                class="ml-auto text-[10px] bg-white/10 text-navy-200 px-1.5 py-0.5 rounded-full"></span>
        </button>
      </template>
    </nav>

    <div class="p-2 border-t border-white/10 shrink-0">
      <button @click="sidebarOpen = !sidebarOpen"
              class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-navy-300 hover:bg-white/5 hover:text-white text-sm transition">
        <i :data-lucide="sidebarOpen ? 'panel-left-close' : 'panel-left-open'" class="w-[18px] h-[18px]"></i>
        <span x-show="sidebarOpen">Réduire</span>
      </button>
    </div>
  </aside>

  <!-- Colonne principale -->
  <div class="flex-1 min-w-0 flex flex-col">

    <!-- Barre supérieure -->
    <header class="h-16 bg-white border-b border-navy-100 flex items-center justify-between px-6 shrink-0 sticky top-0 z-10">
      <div>
        <h2 class="font-display font-bold text-navy-900" x-text="currentModuleLabel"></h2>
      </div>
      <div class="flex items-center gap-4">
        <div class="text-right">
          <p class="text-sm font-semibold text-navy-800 leading-none" x-text="utilisateur?.nom_affichage || session?.user?.email"></p>
          <p class="text-xs text-navy-400 mt-1" x-text="rolesLabel"></p>
        </div>
        <div class="w-9 h-9 rounded-full bg-navy-800 text-white flex items-center justify-center text-sm font-semibold shrink-0"
             x-text="initiales"></div>
        <button @click="logout()" title="Se déconnecter"
                class="w-9 h-9 rounded-lg border border-navy-100 text-navy-500 hover:bg-navy-50 hover:text-navy-800 flex items-center justify-center transition">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Contenu -->
    <main class="flex-1 overflow-y-auto p-6">

      <!-- ================= TABLEAU DE BORD ================= -->
      <template x-if="currentView === 'dashboard'">
        <div x-data="dashboardModule()" x-init="load()" class="space-y-6">

          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <template x-for="kpi in kpis" :key="kpi.label">
              <div class="card p-5">
                <div class="flex items-center justify-between mb-3">
                  <div class="w-9 h-9 rounded-lg flex items-center justify-center" :class="kpi.bg">
                    <i :data-lucide="kpi.icon" class="w-[18px] h-[18px]" :class="kpi.color"></i>
                  </div>
                </div>
                <p class="text-2xl font-display font-bold text-navy-900" x-text="loading ? '—' : kpi.value"></p>
                <p class="text-xs text-navy-400 mt-1" x-text="kpi.label"></p>
              </div>
            </template>
          </div>

          <div class="grid lg:grid-cols-2 gap-4">
            <div class="card p-5">
              <h3 class="font-display font-semibold text-navy-800 mb-4">Répartition par direction</h3>
              <canvas id="chartRepartition" height="220"></canvas>
            </div>
            <div class="card p-5">
              <h3 class="font-display font-semibold text-navy-800 mb-4">Pyramide des âges</h3>
              <canvas id="chartPyramide" height="220"></canvas>
            </div>
          </div>

          <div class="card p-5">
            <h3 class="font-display font-semibold text-navy-800 mb-4">Documents à renouveler (30 prochains jours)</h3>
            <p class="text-sm text-navy-500" x-show="!loading && indicateurs?.documents_a_renouveler_30j === 0">Aucun document à renouveler dans les 30 prochains jours.</p>
            <p class="text-sm text-navy-700" x-show="!loading && indicateurs?.documents_a_renouveler_30j > 0">
              <span class="font-semibold" x-text="indicateurs?.documents_a_renouveler_30j"></span> document(s) administratif(s) arrivent à expiration — pensez à relancer les agents concernés.
            </p>
          </div>
        </div>
      </template>

      <!-- ================= AGENTS ================= -->
      <template x-if="currentView === 'agents'">
        <div x-data="agentsModule()" x-init="load()">
          <template x-if="!showForm && !selectedAgent">
            <div class="space-y-4">
              <div class="flex flex-wrap items-center gap-3 justify-between">
                <div class="relative flex-1 min-w-[240px] max-w-sm">
                  <i data-lucide="search" class="w-4 h-4 text-navy-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                  <input type="text" x-model.debounce.400ms="search" @input="page = 0; load()"
                         placeholder="Rechercher un agent (nom, matricule…)"
                         class="w-full pl-9 pr-3 py-2 rounded-lg border border-navy-100 text-sm focus:outline-none focus:ring-2 focus:ring-lagoon-400">
                </div>
                <button @click="openCreate()"
                        class="flex items-center gap-2 bg-navy-800 hover:bg-navy-900 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
                  <i data-lucide="user-plus" class="w-4 h-4"></i> Nouvel agent
                </button>
              </div>

              <div class="card overflow-hidden">
                <table class="w-full text-sm">
                  <thead class="bg-navy-50 text-navy-500 text-xs uppercase tracking-wide">
                    <tr>
                      <th class="text-left font-medium px-4 py-3">Matricule</th>
                      <th class="text-left font-medium px-4 py-3">Agent</th>
                      <th class="text-left font-medium px-4 py-3">Direction</th>
                      <th class="text-left font-medium px-4 py-3">Service</th>
                      <th class="text-left font-medium px-4 py-3">Statut</th>
                      <th class="text-right font-medium px-4 py-3"></th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-navy-50">
                    <template x-if="loading">
                      <tr><td colspan="6" class="px-4 py-8 text-center text-navy-400">Chargement…</td></tr>
                    </template>
                    <template x-if="!loading && agents.length === 0">
                      <tr><td colspan="6" class="px-4 py-8 text-center text-navy-400">Aucun agent trouvé.</td></tr>
                    </template>
                    <template x-for="a in agents" :key="a.id">
                      <tr class="hover:bg-navy-50/60 cursor-pointer transition" @click="openDetail(a)">
                        <td class="px-4 py-3 font-mono text-xs text-navy-500" x-text="a.matricule"></td>
                        <td class="px-4 py-3 font-medium text-navy-800" x-text="a.nom + ' ' + a.prenoms"></td>
                        <td class="px-4 py-3 text-navy-600" x-text="a.directions?.nom || '—'"></td>
                        <td class="px-4 py-3 text-navy-600" x-text="a.services?.nom || '—'"></td>
                        <td class="px-4 py-3">
                          <span class="text-xs px-2 py-0.5 rounded-full font-medium"
                                :class="statutBadge(a.statut)" x-text="a.statut"></span>
                        </td>
                        <td class="px-4 py-3 text-right">
                          <i data-lucide="chevron-right" class="w-4 h-4 text-navy-300 inline-block"></i>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <div class="flex items-center justify-between text-sm text-navy-500">
                <span x-text="`${total} agent(s) au total`"></span>
                <div class="flex items-center gap-2">
                  <button @click="page > 0 && (page--, load())" :disabled="page === 0"
                          class="px-3 py-1.5 rounded-lg border border-navy-100 disabled:opacity-40">Précédent</button>
                  <span x-text="`Page ${page + 1}`"></span>
                  <button @click="(page + 1) * pageSize < total && (page++, load())" :disabled="(page + 1) * pageSize >= total"
                          class="px-3 py-1.5 rounded-lg border border-navy-100 disabled:opacity-40">Suivant</button>
                </div>
              </div>
            </div>
          </template>

          <!-- Fiche agent -->
          <template x-if="selectedAgent && !showForm">
            <div class="space-y-4">
              <button @click="selectedAgent = null" class="flex items-center gap-1.5 text-sm text-navy-500 hover:text-navy-800">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Retour à la liste
              </button>
              <div class="card p-6">
                <div class="flex items-start justify-between">
                  <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-full bg-navy-800 text-white flex items-center justify-center font-display font-bold text-lg">
                      <span x-text="(selectedAgent.nom?.[0] || '') + (selectedAgent.prenoms?.[0] || '')"></span>
                    </div>
                    <div>
                      <h3 class="font-display font-bold text-lg text-navy-900" x-text="selectedAgent.nom + ' ' + selectedAgent.prenoms"></h3>
                      <p class="text-sm text-navy-400 font-mono" x-text="selectedAgent.matricule"></p>
                    </div>
                  </div>
                  <span class="text-xs px-2.5 py-1 rounded-full font-medium" :class="statutBadge(selectedAgent.statut)" x-text="selectedAgent.statut"></span>
                </div>

                <div class="grid sm:grid-cols-2 gap-4 mt-6 pt-6 border-t border-navy-100">
                  <div>
                    <p class="text-xs text-navy-400 mb-0.5">Direction</p>
                    <p class="text-sm text-navy-800" x-text="selectedAgent.directions?.nom || '—'"></p>
                  </div>
                  <div>
                    <p class="text-xs text-navy-400 mb-0.5">Service</p>
                    <p class="text-sm text-navy-800" x-text="selectedAgent.services?.nom || '—'"></p>
                  </div>
                  <div>
                    <p class="text-xs text-navy-400 mb-0.5">Date d'entrée en fonction</p>
                    <p class="text-sm text-navy-800" x-text="formatDate(selectedAgent.date_entree_fonction)"></p>
                  </div>
                  <div>
                    <p class="text-xs text-navy-400 mb-0.5">Sexe</p>
                    <p class="text-sm text-navy-800" x-text="selectedAgent.sexe === 'M' ? 'Masculin' : (selectedAgent.sexe === 'F' ? 'Féminin' : '—')"></p>
                  </div>
                </div>
              </div>
            </div>
          </template>

          <!-- Formulaire création -->
          <template x-if="showForm">
            <div class="space-y-4 max-w-2xl">
              <button @click="showForm = false" class="flex items-center gap-1.5 text-sm text-navy-500 hover:text-navy-800">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Annuler
              </button>
              <form @submit.prevent="submitCreate()" class="card p-6 space-y-4">
                <h3 class="font-display font-semibold text-navy-800">Nouvel agent</h3>

                <div class="grid sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-medium text-navy-500 mb-1">Matricule *</label>
                    <input required x-model="form.matricule" class="w-full px-3 py-2 rounded-lg border border-navy-100 text-sm focus:outline-none focus:ring-2 focus:ring-lagoon-400">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-navy-500 mb-1">Sexe</label>
                    <select x-model="form.sexe" class="w-full px-3 py-2 rounded-lg border border-navy-100 text-sm focus:outline-none focus:ring-2 focus:ring-lagoon-400">
                      <option value="">—</option>
                      <option value="M">Masculin</option>
                      <option value="F">Féminin</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-navy-500 mb-1">Nom *</label>
                    <input required x-model="form.nom" class="w-full px-3 py-2 rounded-lg border border-navy-100 text-sm focus:outline-none focus:ring-2 focus:ring-lagoon-400">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-navy-500 mb-1">Prénoms *</label>
                    <input required x-model="form.prenoms" class="w-full px-3 py-2 rounded-lg border border-navy-100 text-sm focus:outline-none focus:ring-2 focus:ring-lagoon-400">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-navy-500 mb-1">Date de naissance</label>
                    <input type="date" x-model="form.date_naissance" class="w-full px-3 py-2 rounded-lg border border-navy-100 text-sm focus:outline-none focus:ring-2 focus:ring-lagoon-400">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-navy-500 mb-1">Date d'entrée en fonction</label>
                    <input type="date" x-model="form.date_entree_fonction" class="w-full px-3 py-2 rounded-lg border border-navy-100 text-sm focus:outline-none focus:ring-2 focus:ring-lagoon-400">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-navy-500 mb-1">Direction</label>
                    <select x-model="form.direction_id" class="w-full px-3 py-2 rounded-lg border border-navy-100 text-sm focus:outline-none focus:ring-2 focus:ring-lagoon-400">
                      <option value="">—</option>
                      <template x-for="d in referentiels.directions" :key="d.id">
                        <option :value="d.id" x-text="d.nom"></option>
                      </template>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-navy-500 mb-1">Service</label>
                    <select x-model="form.service_id" class="w-full px-3 py-2 rounded-lg border border-navy-100 text-sm focus:outline-none focus:ring-2 focus:ring-lagoon-400">
                      <option value="">—</option>
                      <template x-for="s in referentiels.services" :key="s.id">
                        <option :value="s.id" x-text="s.nom"></option>
                      </template>
                    </select>
                  </div>
                </div>

                <p x-show="formError" x-text="formError" class="text-sm text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2"></p>

                <div class="flex justify-end gap-3 pt-2">
                  <button type="button" @click="showForm = false" class="px-4 py-2 rounded-lg text-sm font-medium text-navy-500 hover:bg-navy-50">Annuler</button>
                  <button type="submit" :disabled="formLoading"
                          class="px-4 py-2 rounded-lg text-sm font-semibold text-white bg-navy-800 hover:bg-navy-900 disabled:opacity-60">
                    <span x-text="formLoading ? 'Enregistrement…' : 'Créer l\'agent'"></span>
                  </button>
                </div>
              </form>
            </div>
          </template>
        </div>
      </template>

      <!-- ================= MODULES EN CONSTRUCTION ================= -->
      <template x-if="!['dashboard','agents'].includes(currentView)">
        <div class="flex flex-col items-center justify-center py-24 text-center">
          <div class="w-14 h-14 rounded-2xl bg-navy-100 flex items-center justify-center mb-4">
            <i data-lucide="hammer" class="w-6 h-6 text-navy-400"></i>
          </div>
          <h3 class="font-display font-semibold text-navy-700">Module « <span x-text="currentModuleLabel"></span> »</h3>
          <p class="text-sm text-navy-400 mt-1">Ce module sera construit dans une prochaine étape.</p>
        </div>
      </template>

    </main>
  </div>
</div>

<script>
  // ============================================================
  // CONFIGURATION SUPABASE — à compléter avec vos identifiants
  // (Supabase → Project Settings → API)
  // ============================================================
  const SUPABASE_URL = 'https://svtmwyogwfwwfbfiuxij.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_fFdCyt5wtHQ9Up7-SJhlkg_j7Gm6EA0';

  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    db: { schema: 'rh' } // toutes les requêtes .from() ciblent le schéma rh par défaut
  });

  function rhApp() {
    return {
      // --- État global ---
      session: null,
      utilisateur: null,
      roles: [],
      sidebarOpen: true,
      currentView: 'dashboard',

      loginForm: { email: '', password: '' },
      loginLoading: false,
      loginError: '',

      modules: [
        { id: 'dashboard',   label: 'Tableau de bord', icon: 'layout-dashboard' },
        { id: 'agents',      label: 'Agents',           icon: 'users' },
        { id: 'organisation',label: 'Organisation',     icon: 'building-2' },
        { id: 'carriere',    label: 'Carrière',         icon: 'trending-up' },
        { id: 'recrutement', label: 'Recrutement',      icon: 'user-plus' },
        { id: 'temps',       label: 'Temps de travail', icon: 'calendar-clock' },
        { id: 'paie',        label: 'Paie',             icon: 'wallet' },
        { id: 'evaluation',  label: 'Évaluation',       icon: 'star' },
        { id: 'formation',   label: 'Formation',        icon: 'graduation-cap' },
        { id: 'administration', label: 'Administration', icon: 'shield' },
      ],

      get currentModuleLabel() {
        return this.modules.find(m => m.id === this.currentView)?.label || '';
      },
      get initiales() {
        const n = this.utilisateur?.nom_affichage || this.session?.user?.email || '';
        return n.split(/[\s.@]/).filter(Boolean).slice(0, 2).map(s => s[0]?.toUpperCase()).join('');
      },
      get rolesLabel() {
        return this.roles.length ? this.roles.join(' · ') : 'Aucun rôle attribué';
      },

      async initApp() {
        // Rendu initial des icônes + rendu après chaque changement de vue
        this.$watch('currentView', () => this.$nextTick(() => lucide.createIcons()));
        this.$watch('session', () => this.$nextTick(() => lucide.createIcons()));

        const { data } = await supa.auth.getSession();
        this.session = data.session;
        if (this.session) await this.loadUtilisateur();

        supa.auth.onAuthStateChange((_event, session) => {
          this.session = session;
          if (session) this.loadUtilisateur();
        });

        this.$nextTick(() => lucide.createIcons());
      },

      async loadUtilisateur() {
        const userId = this.session.user.id;
        const { data, error } = await supa
          .from('utilisateurs')
          .select('*, user_roles(roles(code, nom))')
          .eq('id', userId)
          .maybeSingle();

        if (error) { console.error(error); return; }

        if (!data) {
          // Compte auth existant mais jamais rattaché à rh.utilisateurs :
          // on crée la ligne minimale (le Super Admin devra ensuite lui attribuer un rôle)
          await supa.from('utilisateurs').insert({
            id: userId, email: this.session.user.email, nom_affichage: this.session.user.email
          });
          this.utilisateur = { id: userId, email: this.session.user.email, nom_affichage: this.session.user.email };
          this.roles = [];
          return;
        }

        this.utilisateur = data;
        this.roles = (data.user_roles || []).map(ur => ur.roles?.nom).filter(Boolean);
      },

      async login() {
        this.loginError = '';
        this.loginLoading = true;
        const { error } = await supa.auth.signInWithPassword({
          email: this.loginForm.email,
          password: this.loginForm.password,
        });
        this.loginLoading = false;
        if (error) {
          this.loginError = error.message === 'Invalid login credentials'
            ? 'Adresse e-mail ou mot de passe incorrect.'
            : error.message;
        }
      },

      async logout() {
        await supa.auth.signOut();
        this.utilisateur = null;
        this.roles = [];
        this.currentView = 'dashboard';
      },
    };
  }

  // ============================================================
  // MODULE : Tableau de bord
  // ============================================================
  function dashboardModule() {
    return {
      loading: true,
      indicateurs: null,
      kpis: [],
      chartRepartition: null,
      chartPyramide: null,

      async load() {
        this.loading = true;

        const [{ data: ind }, { data: repartition }, { data: pyramide }] = await Promise.all([
          supa.from('vue_indicateurs_rh').select('*').maybeSingle(),
          supa.from('vue_repartition_direction').select('*'),
          supa.from('vue_pyramide_ages').select('*'),
        ]);

        this.indicateurs = ind || {};
        this.kpis = [
          { label: 'Agents actifs',        value: ind?.effectif_total_actif ?? 0, icon: 'users',        bg: 'bg-lagoon-500/10', color: 'text-lagoon-600' },
          { label: 'Âge moyen',            value: (ind?.age_moyen ?? '—') + ' ans', icon: 'calendar',     bg: 'bg-navy-500/10',   color: 'text-navy-700' },
          { label: 'Congés en attente',    value: ind?.conges_en_attente_validation ?? 0, icon: 'clock',   bg: 'bg-amber-500/10',  color: 'text-amber-600' },
          { label: 'Candidatures en cours',value: ind?.candidatures_en_cours ?? 0, icon: 'file-text',    bg: 'bg-violet-500/10', color: 'text-violet-600' },
        ];

        this.loading = false;
        this.$nextTick(() => {
          this.renderRepartition(repartition || []);
          this.renderPyramide(pyramide || []);
        });
      },

      renderRepartition(rows) {
        const ctx = document.getElementById('chartRepartition');
        if (!ctx) return;
        if (this.chartRepartition) this.chartRepartition.destroy();
        this.chartRepartition = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: rows.map(r => r.direction || 'Non affecté'),
            datasets: [{ data: rows.map(r => r.nombre_agents), backgroundColor: '#26436a', borderRadius: 6 }],
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
          },
        });
      },

      renderPyramide(rows) {
        const ctx = document.getElementById('chartPyramide');
        if (!ctx) return;
        const tranches = [...new Set(rows.map(r => r.tranche_age))];
        const hommes = tranches.map(t => rows.find(r => r.tranche_age === t && r.sexe === 'M')?.nombre_agents || 0);
        const femmes = tranches.map(t => rows.find(r => r.tranche_age === t && r.sexe === 'F')?.nombre_agents || 0);
        if (this.chartPyramide) this.chartPyramide.destroy();
        this.chartPyramide = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: tranches,
            datasets: [
              { label: 'Hommes', data: hommes, backgroundColor: '#2c9c8f', borderRadius: 6 },
              { label: 'Femmes', data: femmes, backgroundColor: '#d9a441', borderRadius: 6 },
            ],
          },
          options: {
            responsive: true,
            plugins: { legend: { position: 'bottom' } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
          },
        });
      },
    };
  }

  // ============================================================
  // MODULE : Agents
  // ============================================================
  function agentsModule() {
    return {
      agents: [], total: 0, page: 0, pageSize: 15,
      search: '', loading: true,
      selectedAgent: null,
      showForm: false, formLoading: false, formError: '',
      form: { matricule: '', nom: '', prenoms: '', sexe: '', date_naissance: '', date_entree_fonction: '', direction_id: '', service_id: '' },
      referentiels: { directions: [], services: [] },

      async load() {
        this.loading = true;
        let query = supa
          .from('agents')
          .select('id, matricule, nom, prenoms, statut, sexe, date_entree_fonction, directions(nom), services(nom)', { count: 'exact' })
          .order('nom', { ascending: true })
          .range(this.page * this.pageSize, this.page * this.pageSize + this.pageSize - 1);

        if (this.search) {
          query = query.or(`nom.ilike.%${this.search}%,prenoms.ilike.%${this.search}%,matricule.ilike.%${this.search}%`);
        }

        const { data, count, error } = await query;
        if (error) { console.error(error); this.loading = false; return; }
        this.agents = data || [];
        this.total = count || 0;
        this.loading = false;
      },

      openDetail(agent) { this.selectedAgent = agent; },

      async openCreate() {
        this.showForm = true;
        this.formError = '';
        const [{ data: directions }, { data: services }] = await Promise.all([
          supa.from('directions').select('id, nom').eq('actif', true).order('nom'),
          supa.from('services').select('id, nom').eq('actif', true).order('nom'),
        ]);
        this.referentiels.directions = directions || [];
        this.referentiels.services = services || [];
      },

      async submitCreate() {
        this.formLoading = true;
        this.formError = '';
        const payload = { ...this.form };
        Object.keys(payload).forEach(k => { if (payload[k] === '') payload[k] = null; });

        const { error } = await supa.from('agents').insert(payload);
        this.formLoading = false;

        if (error) {
          this.formError = error.message;
          return;
        }
        this.showForm = false;
        this.form = { matricule: '', nom: '', prenoms: '', sexe: '', date_naissance: '', date_entree_fonction: '', direction_id: '', service_id: '' };
        this.page = 0;
        this.load();
      },

      statutBadge(statut) {
        const map = {
          actif:    'bg-lagoon-500/10 text-lagoon-700',
          suspendu: 'bg-amber-500/10 text-amber-700',
          radie:    'bg-red-500/10 text-red-700',
          retraite: 'bg-navy-500/10 text-navy-600',
          decede:   'bg-navy-900/10 text-navy-800',
        };
        return map[statut] || 'bg-navy-100 text-navy-600';
      },

      formatDate(d) {
        if (!d) return '—';
        return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
      },
    };
  }
</script>
